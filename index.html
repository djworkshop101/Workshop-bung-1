<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101010">
<title>DJ Rhythmus-Trainer</title>
<style>
:root{
  --bg:#101010; --panel:#1b1b1b; --panel2:#242424; --text:#fff; --muted:#bdbdbd;
  --accent:#73a8ff; --good:#42d87b; --warn:#ffd34f; --bad:#ff7373;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:18px}
h1{font-size:clamp(32px,6vw,54px);margin:10px 0 8px}
h2{font-size:clamp(26px,5vw,42px);margin:8px 0}
h3{font-size:clamp(22px,4vw,32px);margin:10px 0}
p{font-size:clamp(18px,3vw,24px);line-height:1.35}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card,.panel{background:var(--panel);border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.big{width:100%;min-height:100px;border:0;border-radius:22px;background:#303030;color:white;font-weight:800;font-size:clamp(23px,4vw,34px);padding:18px;cursor:pointer}
.big:active,.small:active{transform:scale(.985)}
.primary{background:var(--accent);color:#09182a}
.success{background:var(--good);color:#062814}
.secondary{background:#343434}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 170px}
.small{border:0;border-radius:16px;background:#333;color:#fff;padding:13px 15px;font-weight:700;font-size:18px;cursor:pointer}
.hidden{display:none!important}
.feedback{min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:22px;background:#292929;font-size:clamp(28px,6vw,50px);font-weight:900;margin:16px 0;padding:12px}
.feedback.good{background:rgba(66,216,123,.15);color:var(--good)}
.feedback.warn{background:rgba(255,211,79,.13);color:var(--warn)}
.feedback.bad{background:rgba(255,115,115,.14);color:var(--bad)}
.count{font-size:clamp(72px,20vw,155px);font-weight:950;text-align:center;line-height:1;margin:12px 0}
.tap{min-height:170px;font-size:clamp(38px,10vw,76px);border-radius:34px;touch-action:manipulation}
.meter{height:22px;background:#343434;border-radius:999px;overflow:hidden;margin:14px 0}
.meter>div{height:100%;width:0;background:var(--accent);transition:width .15s}
.progressText{text-align:center;font-size:20px;font-weight:800;color:var(--muted)}
.jogWrap{display:flex;justify-content:center;margin:20px 0}
.jog{width:min(68vw,360px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#333 0 21%,#222 22% 54%,#444 55% 58%,#171717 59%);border:8px solid #555;position:relative;touch-action:none;user-select:none;box-shadow:inset 0 0 30px #000,0 10px 30px rgba(0,0,0,.35)}
.jog:after{content:"";position:absolute;left:50%;top:7%;width:8px;height:22%;background:white;border-radius:10px;transform:translateX(-50%)}
.jogLabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:900;pointer-events:none;padding:70px}
.answerGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.answerGrid button{min-height:110px}
.resultBox{background:var(--panel2);border-radius:22px;padding:22px;margin-top:18px;text-align:center}
.resultStat{font-size:clamp(24px,4vw,34px);font-weight:800;margin:12px 0;padding:14px;border-radius:16px}
.statGood{background:rgba(66,216,123,.15);color:var(--good)}
.statWarn{background:rgba(255,211,79,.13);color:var(--warn)}
.statBad{background:rgba(255,115,115,.14);color:var(--bad)}
.bpmDisplay{font-size:clamp(52px,14vw,110px);font-weight:950;text-align:center;margin:20px 0}
.footer{font-size:14px;color:#8f8f8f;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <h1>DJ Rhythmus-Trainer</h1>
  <p class="muted">Wähle einen Bereich.</p>
  <div class="grid">
    <button class="big primary" onclick="showScreen('aHub')">🥁 DIE 1 FINDEN</button>
    <button class="big primary" onclick="showScreen('bHub')">🎧 ZUSAMMENBRINGEN</button>
  </div>
</section>

<section id="aHub" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('home')">← Startseite</button></div>
  <h2>🥁 Die 1 finden</h2>
  <div class="grid">
    <button class="big secondary" onclick="showScreen('aStartMenu')">🟢 START</button>
    <button class="big secondary" onclick="showScreen('aMusicMenu')">🎵 MUSIK</button>
    <button class="big secondary" onclick="startOwnSongBpm()">🎶 DEIN SONG</button>
  </div>
</section>

<section id="aStartMenu" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('aHub')">← Zurück</button></div>
  <h2>🟢 Start</h2>
  <div class="grid">
    <button class="big secondary" onclick="startA(1)">👆 Mitklopfen<br><span class="muted">Tippe jeden Schlag</span></button>
    <button class="big secondary" onclick="startA(2)">1️⃣ Die 1<br><span class="muted">Tippe nur auf die 1</span></button>
  </div>
</section>

<section id="aMusicMenu" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('aHub')">← Zurück</button></div>
  <h2>🎵 Musik</h2>
  <div class="grid">
    <button class="big secondary" onclick="startA(3)">🎵 Musik + Hilfe<br><span class="muted">Tippe auf die 1</span></button>
    <button class="big secondary" onclick="startA(4)">🥁 Drumgroove<br><span class="muted">Finde die 1</span></button>
    <button class="big secondary" onclick="startA(5)">🎶 Musikgroove<br><span class="muted">Finde die 1</span></button>
  </div>
</section>

<section id="ownSongGame" class="hidden">
  <div class="row">
    <button class="small" onclick="resetOwnSong();showScreen('aHub')">← Zurück</button>
    <button class="small" onclick="resetOwnSong()">↻ Neu</button>
  </div>
  <h2 id="ownSongTitle">DEIN SONG</h2>
  <div class="panel">
    <p id="ownSongInstruction"></p>
    <div class="progressText" id="ownProgress"></div>
    <div class="bpmDisplay" id="ownBpm">–</div>
    <button class="big tap primary" id="ownTap" onclick="registerOwnTap()">TAPPEN</button>
    <div id="ownInfo" class="feedback">Bereit.</div>
  </div>
</section>

<section id="bHub" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('home')">← Startseite</button></div>
  <h2>🎧 Zusammenbringen</h2>
  <div class="grid">
    <button class="big secondary" onclick="showScreen('bHearMenu')">👂 HÖREN</button>
    <button class="big secondary" onclick="showScreen('bMatchMenu')">🎛️ MATCHEN</button>
  </div>
</section>

<section id="bHearMenu" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('bHub')">← Zurück</button></div>
  <h2>👂 HÖREN</h2>
  <div class="grid">
    <button class="big secondary" onclick="startBHear(1)">👂 Welcher passt besser?</button>
    <button class="big secondary" onclick="startBHear(2)">👂 Genau hinhören</button>
    <button class="big secondary" onclick="startBHear(3)">🎵 Mit Musik</button>
  </div>
</section>

<section id="bMatchMenu" class="hidden">
  <div class="row"><button class="small" onclick="showScreen('bHub')">← Zurück</button></div>
  <h2>✋ MATCHEN</h2>
  <div class="grid">
    <button class="big secondary" onclick="startBMatch(1)">🥁 Beat auf Beat</button>
    <button class="big secondary" onclick="startBMatch(2)">🎵 Mit Musik</button>
    <button class="big secondary" onclick="startBMatch(3)">🙈 Ohne Hilfe</button>
  </div>
</section>

<section id="aGame" class="hidden">
  <div class="row">
    <button class="small" onclick="stopAll();showScreen(aLevel<=2?'aStartMenu':'aMusicMenu')">← Spiele auswählen</button>
    <button class="small" onclick="restartCurrentA()">↻ Neu</button>
  </div>
  <h2 id="aTitle"></h2>
  <div class="panel">
    <p id="aInstruction"></p>
    <div class="progressText" id="aProgress"></div>
    <div id="aCount" class="count">–</div>
    <div id="aFeedback" class="feedback">Drücke Start.</div>
    <div class="meter"><div id="aMeter"></div></div>
    <button id="aStart" class="big success" onclick="startARun()">▶ Start</button>
    <button id="aTap" class="big tap primary hidden" onclick="registerATap()">TIPPEN</button>
  </div>
</section>

<section id="bHearGame" class="hidden">
  <div class="row">
    <button class="small" onclick="stopHearSnippet();showScreen('bHearMenu')">← Spiele auswählen</button>
    <button class="small" onclick="restartBHear()">↻ Neu</button>
  </div>
  <h2 id="bhTitle"></h2>
  <div class="panel">
    <p id="bhInstruction"></p>
    <div class="progressText" id="bhProgress"></div>
    <div class="row">
      <button id="playA" class="big secondary" onclick="toggleComparison('A')">▶ Mix A</button>
      <button id="playB" class="big secondary" onclick="toggleComparison('B')">▶ Mix B</button>
    </div>
    <div class="answerGrid">
      <button class="big primary" onclick="answerBHear('A')">Mix A</button>
      <button class="big primary" onclick="answerBHear('B')">Mix B</button>
    </div>
    <div id="bhFeedback" class="feedback">Höre beide Mixe nacheinander.</div>
  </div>
</section>

<section id="bMatchGame" class="hidden">
  <div class="row">
    <button class="small" onclick="stopAll();showScreen('bMatchMenu')">← Spiele auswählen</button>
    <button class="small" onclick="restartBMatch()">↻ Neu</button>
  </div>
  <h2 id="bmTitle"></h2>
  <div class="panel">
    <p id="bmInstruction"></p>
    <div class="progressText" id="bmProgress"></div>
    <div id="bmFeedback" class="feedback">Drücke Start.</div>
    <button id="bmStart" class="big success" onclick="toggleBMatch()">▶ Start</button>
    <div class="jogWrap"><div id="jog" class="jog"><div class="jogLabel">JOGWHEEL<br>↔</div></div></div>
    <div class="row">
      <button class="big secondary" onclick="nudgeMatch(-0.022)">← zurück</button>
      <button class="big secondary" onclick="nudgeMatch(0.022)">vor →</button>
    </div>
    <div class="meter" id="bmMeterWrap"><div id="bmMeter"></div></div>
    <button class="big primary" onclick="checkMatch()">✓ Prüfen</button>
  </div>
</section>

<section id="result" class="hidden">
  <h2>GESCHAFFT!</h2>
  <div class="resultBox">
    <div id="resultText"></div>
    <div class="grid">
      <button class="big success" id="repeatBtn">↻ Nochmal</button>
      <button class="big secondary" id="menuBtn">← Spiele auswählen</button>
      <button class="big secondary" onclick="stopAll();showScreen('home')">⌂ Startseite</button>
    </div>
  </div>
</section>

<p class="footer">Alle Übungsklänge werden direkt im Browser erzeugt.</p>
</div>

<script>
let ctx=null,master=null;
function ensureAudio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.52;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}
function tone(t,f=880,d=.05,g=.12,type='square'){const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.02)}
function kick(t,g=.7,f=115){const o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(48,t+.08);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.17)}
function noiseHit(t,d=.06,g=.08,highpass=2500){const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),gn=ctx.createGain();s.buffer=b;hp.type='highpass';hp.frequency.value=highpass;gn.gain.value=g;s.connect(hp);hp.connect(gn);gn.connect(master);s.start(t)}
function bass(t,f=55,g=.08,d=.18){const o=ctx.createOscillator(),gn=ctx.createGain();o.type='sine';o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.02)}
function synth(t,f=220,g=.035,d=.3,type='triangle'){const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.03)}
function chord(t,root=220,g=.035,d=.35){[1,1.25,1.5].forEach(r=>synth(t,root*r,g,d,'triangle'))}
function setFeedback(id,text,cls=''){const el=document.getElementById(id);el.className='feedback'+(cls?' '+cls:'');el.textContent=text}

const A_BPM=96,A_BEAT=60/A_BPM;

function drumGrooveBeat(t,beat,extraOneClick=false){
  const isOne=beat===0;
  kick(t,isOne?.82:.58,isOne?128:104);
  if(beat===1||beat===3)noiseHit(t,.06,.10,1800);
  noiseHit(t+A_BEAT/2,.025,.04,6000);
  if(extraOneClick&&isOne)tone(t,1350,.035,.11);
}

function musicGrooveBeat(t,beat,secondDeck=false){
  const isOne=beat===0;
  if(!secondDeck){
    kick(t,isOne?.75:.48,isOne?126:102);
    if(beat===1||beat===3)noiseHit(t,.055,.075,1800);
    noiseHit(t+A_BEAT/2,.022,.03,6200);
    if(isOne){bass(t,55,.09,.22);chord(t,220,.024,.28);}
    if(beat===1){synth(t,277,.032,.17,'triangle');bass(t,62,.04,.13);}
    if(beat===2){synth(t,330,.036,.19,'triangle');bass(t,65,.055,.16);}
    if(beat===3){synth(t,247,.032,.16,'triangle');}
    const melody=[440,494,523,587];
    synth(t+A_BEAT/2,melody[beat],.022,.11,'sine');
    if(beat===0||beat===2)synth(t+A_BEAT*.75,melody[(beat+1)%4],.016,.08,'triangle');
  }else{
    kick(t,isOne?.54:.36,isOne?172:145);
    if(beat===1||beat===3)noiseHit(t,.05,.052,2600);
    noiseHit(t+A_BEAT/2,.022,.024,6500);
    if(isOne){bass(t,73,.05,.16);chord(t,293,.016,.22);}
    if(beat===2)synth(t,392,.022,.14,'triangle');
  }
}

function showScreen(id){
  stopAll();
  ['home','aHub','aStartMenu','aMusicMenu','ownSongGame','bHub','bHearMenu','bMatchMenu','aGame','bHearGame','bMatchGame','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ---------- A ---------- */
let aLevel=1,aRunning=false,aTimer=null,aNext=0,aBeatIndex=0,aBarsDone=0,aTargets=[],aExact=0,aNear=0,aMiss=0,aFinished=false;
const aMeta={
  1:["👆 Mitklopfen","Tippe auf jeden Schlag."],
  2:["1️⃣ Die 1","Tippe nur auf die 1."],
  3:["🎵 Musik + Hilfe","Tippe auf die 1."],
  4:["🥁 Drumgroove","Finde die 1."],
  5:["🎶 Musikgroove","Finde die 1."]
};

function startA(level){
  aLevel=level;
  showScreen('aGame');
  document.getElementById('aTitle').textContent=aMeta[level][0];
  document.getElementById('aInstruction').textContent=aMeta[level][1];
  restartCurrentA();
}
function restartCurrentA(){
  stopA();
  aExact=0;aNear=0;aMiss=0;aBarsDone=0;aTargets=[];aFinished=false;
  document.getElementById('aCount').textContent='–';
  document.getElementById('aMeter').style.width='0%';
  document.getElementById('aStart').classList.remove('hidden');
  document.getElementById('aTap').classList.add('hidden');
  setFeedback('aFeedback','Drücke Start.');
  document.getElementById('aProgress').textContent='Takt 1 von 10';
}
function startARun(){
  if(aRunning)return;
  ensureAudio();
  aRunning=true;
  document.getElementById('aStart').classList.add('hidden');
  document.getElementById('aTap').classList.remove('hidden');
  aNext=ctx.currentTime+.35;
  aBeatIndex=0;aBarsDone=0;aTargets=[];aFinished=false;
  aTimer=setInterval(scheduleA,20);
  scheduleA();
}
function stopA(){aRunning=false;if(aTimer)clearInterval(aTimer);aTimer=null}

function scheduleA(){
  if(!aRunning||aFinished)return;
  while(aNext<ctx.currentTime+.15){
    const beat=aBeatIndex%4,isOne=beat===0;
    if(aLevel===1)tone(aNext,isOne?1150:850,.04,isOne?.15:.10);
    else if(aLevel===2)tone(aNext,isOne?1300:820,.04,isOne?.19:.09);
    else if(aLevel===3)drumGrooveBeat(aNext,beat,true);
    else if(aLevel===4)drumGrooveBeat(aNext,beat,false);
    else if(aLevel===5)musicGrooveBeat(aNext,beat,false);

    const isTarget=(aLevel===1)||isOne;
    if(isTarget)aTargets.push({t:aNext,used:false,judged:false});

    setTimeout(()=>{if(aRunning&&!aFinished)document.getElementById('aCount').textContent=beat+1},Math.max(0,(aNext-ctx.currentTime)*1000));

    aBeatIndex++;
    if(aBeatIndex%4===0){
      aBarsDone++;
      const bar=aBarsDone;
      setTimeout(()=>{if(!aFinished)document.getElementById('aProgress').textContent=`Takt ${Math.min(bar,10)} von 10`},Math.max(0,(aNext-ctx.currentTime)*1000));
      if(aBarsDone>=10){
        aFinished=true;
        setTimeout(finishA,Math.max(500,(aNext-ctx.currentTime+A_BEAT*.9)*1000));
      }
    }
    aNext+=A_BEAT;
  }
}

function registerATap(){
  if(!aRunning||aFinished)return;
  const now=ctx.currentTime;

  // Look both backward and forward so early taps can be matched to the upcoming target.
  const candidates=aTargets.filter(x=>!x.used && Math.abs(now-x.t)<=.28);
  if(!candidates.length){
    aMiss++;
    setFeedback('aFeedback','Verpasst','bad');
    document.getElementById('aMeter').style.width='15%';
    return;
  }
  let best=candidates[0],bestAbs=Math.abs(now-best.t);
  for(const x of candidates){
    const d=Math.abs(now-x.t);
    if(d<bestAbs){best=x;bestAbs=d;}
  }
  best.used=true;
  const diff=now-best.t;
  if(bestAbs<=.09){
    aExact++;
    setFeedback('aFeedback','✓ Genau!','good');
    document.getElementById('aMeter').style.width='100%';
  }else if(bestAbs<=.18){
    aNear++;
    setFeedback('aFeedback',diff<0?'Fast – etwas zu früh':'Fast – etwas zu spät','warn');
    document.getElementById('aMeter').style.width='70%';
  }else{
    aMiss++;
    setFeedback('aFeedback',diff<0?'Zu früh':'Zu spät','bad');
    document.getElementById('aMeter').style.width='20%';
  }
}

function finishA(){
  stopA();
  // Count untapped expected targets as missed.
  const expected=aLevel===1?40:10;
  const counted=aExact+aNear+aMiss;
  if(counted<expected)aMiss+=expected-counted;
  document.getElementById('aTap').classList.add('hidden');
  const html=`
    <p class="resultStat statGood">Genau getroffen: ${aExact}</p>
    <p class="resultStat statWarn">Fast getroffen: ${aNear}</p>
    <p class="resultStat statBad">Verpasst: ${aMiss}</p>`;
  showResultHTML(html,()=>startA(aLevel),aLevel<=2?'aStartMenu':'aMusicMenu');
}

/* ---------- DEIN SONG ---------- */
let ownTimes=[];
function startOwnSongBpm(){
  ownMode='bpm';showScreen('ownSongGame');resetOwnSong();
  document.getElementById('ownSongTitle').textContent='🎶 Dein Song';
  document.getElementById('ownSongInstruction').textContent='Starte deinen Song und tippe mit.';
}

function resetOwnSong(){
  ownTimes=[];
  document.getElementById('ownBpm').textContent='–';
  document.getElementById('ownTap').classList.remove('hidden');
  document.getElementById('ownInfo').className='feedback';
  document.getElementById('ownInfo').textContent='Tippe mit.';
  document.getElementById('ownProgress').textContent='Takt 1 von 6';
}
function registerOwnTap(){
  const now=performance.now()/1000;
  if(ownTimes.length===0 || now-ownTimes[ownTimes.length-1]>.18)ownTimes.push(now);
  const n=ownTimes.length;
  const bar=Math.min(6,Math.floor((n-1)/4)+1);
  document.getElementById('ownProgress').textContent=`Takt ${bar} von 6`;
  if(n<24){
    document.getElementById('ownInfo').textContent=`Noch ${24-n} Taps.`;
    return;
  }
  const intervals=[];
  for(let i=1;i<ownTimes.length;i++){
    const d=ownTimes[i]-ownTimes[i-1];
    if(d>.2&&d<1.5)intervals.push(d);
  }
  intervals.sort((a,b)=>a-b);
  const trim=Math.floor(intervals.length*.15);
  const kept=intervals.slice(trim,intervals.length-trim||intervals.length);
  const avg=kept.reduce((a,b)=>a+b,0)/kept.length;
  const bpm=Math.round(60/avg);
  document.getElementById('ownBpm').textContent=`≈ ${bpm} BPM`;
  document.getElementById('ownProgress').textContent='Geschafft!';
  document.getElementById('ownInfo').textContent='BPM gemessen.';
  document.getElementById('ownInfo').className='feedback good';
  document.getElementById('ownTap').classList.add('hidden');
}


/* Stoppbare Sounds nur für HÖREN */
let hearNodes=[];
function hRegister(node){hearNodes.push(node);return node}
function hKick(t,g=.7,f=115){
  const o=hRegister(ctx.createOscillator()),gn=ctx.createGain();
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(48,t+.08);
  gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.17);
}
function hNoise(t,d=.06,g=.08,highpass=2500){
  const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),data=b.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
  const s=hRegister(ctx.createBufferSource()),hp=ctx.createBiquadFilter(),gn=ctx.createGain();
  s.buffer=b;hp.type='highpass';hp.frequency.value=highpass;gn.gain.value=g;
  s.connect(hp);hp.connect(gn);gn.connect(master);s.start(t);s.stop(t+d+.02);
}
function hBass(t,f=55,g=.08,d=.18){
  const o=hRegister(ctx.createOscillator()),gn=ctx.createGain();
  o.type='sine';o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.02);
}
function hSynth(t,f=220,g=.03,d=.25,type='triangle'){
  const o=hRegister(ctx.createOscillator()),gn=ctx.createGain();
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.03);
}
function hChord(t,root=220,g=.02,d=.25){[1,1.25,1.5].forEach(r=>hSynth(t,root*r,g,d,'triangle'))}
function hMusic(t,beat,second=false){
  const isOne=beat===0;
  if(!second){
    hKick(t,isOne?.75:.48,isOne?126:102);
    if(beat===1||beat===3)hNoise(t,.055,.075,1800);
    hNoise(t+BM_BEAT/2,.022,.03,6200);
    if(isOne){hBass(t,55,.08,.20);hChord(t,220,.018,.24);}
    if(beat===1)hSynth(t,277,.028,.15);
    if(beat===2)hSynth(t,330,.03,.17);
    if(beat===3)hSynth(t,247,.027,.14);
  }else{
    hKick(t,isOne?.53:.35,isOne?172:145);
    if(beat===1||beat===3)hNoise(t,.05,.05,2600);
    hNoise(t+BM_BEAT/2,.022,.022,6500);
    if(isOne){hBass(t,73,.045,.15);hChord(t,293,.012,.20);}
  }
}

/* ---------- B HÖREN ---------- */
let bhLevel=1,bhRound=1,bhScore=0,bhCorrect='A',bhConfigs={A:null,B:null};
let hearPlaying=null,hearStopTime=0,hearStopTimer=null;
const bhMeta={
  1:["👂 Welcher passt besser?","Höre A und B. Welcher passt besser?"],
  2:["👂 Genau hinhören","Höre A und B. Welcher passt besser?"],
  3:["🎵 Mit Musik","Höre A und B. Welcher passt besser?"]
};

function startBHear(level){
  bhLevel=level;showScreen('bHearGame');
  document.getElementById('bhTitle').textContent=bhMeta[level][0];
  document.getElementById('bhInstruction').textContent=bhMeta[level][1];
  restartBHear();
}
function restartBHear(){stopHearSnippet();bhRound=1;bhScore=0;newBHearRound()}
function newBHearRound(){
  stopHearSnippet();
  if(bhRound>5){
    showResultHTML(`<p class="resultStat statGood">${bhScore} von 5 richtig erkannt.</p>`,()=>startBHear(bhLevel),'bHearMenu');
    return;
  }
  document.getElementById('bhProgress').textContent=`Runde ${bhRound} von 5`;
  setFeedback('bhFeedback','Höre Mix A und Mix B.');
  bhCorrect=Math.random()<.5?'A':'B';
  const wrong=bhCorrect==='A'?'B':'A';
  if(bhLevel===1){
    bhConfigs[bhCorrect]={phase:0};
    bhConfigs[wrong]={phase:(Math.random()<.5?-1:1)*(.15+Math.random()*.09)};
  }else if(bhLevel===2){
    bhConfigs[bhCorrect]={phase:0};
    bhConfigs[wrong]={phase:(Math.random()<.5?-1:1)*(.055+Math.random()*.035)};
  }else{
    bhConfigs[bhCorrect]={phase:0};
    bhConfigs[wrong]={phase:(Math.random()<.5?-1:1)*(.07+Math.random()*.08)};
  }
}

function toggleComparison(which){
  if(hearPlaying===which){stopHearSnippet();return}
  stopHearSnippet();
  playComparison(which);
}
function playComparison(which){
  ensureAudio();
  hearPlaying=which;
  document.getElementById('playA').textContent=which==='A'?'■ Stop':'▶ Mix A';
  document.getElementById('playB').textContent=which==='B'?'■ Stop':'▶ Mix B';
  const cfg=bhConfigs[which],beat=60/100,start=ctx.currentTime+.12,totalBeats=12;
  for(let i=0;i<totalBeats;i++){
    const t=start+i*beat;
    if(bhLevel===1||bhLevel===2){
      hKick(t,.58,105);
      hKick(t+cfg.phase,.42,150);
    }else{
      const b=i%4;
      hMusic(t,b,false);
      hMusic(t+cfg.phase,b,true);
    }
  }
  hearStopTimer=setTimeout(stopHearSnippet,(totalBeats*beat+.35)*1000);
}
function stopHearSnippet(){
  if(hearStopTimer)clearTimeout(hearStopTimer);
  hearStopTimer=null;
  for(const node of hearNodes){try{node.stop()}catch(e){}}
  hearNodes=[];
  hearPlaying=null;
  const a=document.getElementById('playA'),b=document.getElementById('playB');
  if(a)a.textContent='▶ Mix A';
  if(b)b.textContent='▶ Mix B';
}
function answerBHear(ans){
  stopHearSnippet();
  if(ans===bhCorrect){bhScore++;setFeedback('bhFeedback','✓ Richtig!','good')}
  else setFeedback('bhFeedback',`Diesmal war Mix ${bhCorrect} richtig.`,'warn');
  bhRound++;setTimeout(newBHearRound,700);
}

/* ---------- B MATCH ---------- */
const BM_BEAT=60/100;
let bmLevel=1,bmRound=1,bmSuccess=0,bmRunning=false,bmTimer=null,bmNextA=0,bmNextB=0,bmCountA=0,bmCountB=0,bmPhase=0,bmRoundMode='beat';
const bmMeta={
  1:["🥁 Beat auf Beat","Schiebe die Beats zusammen."],
  2:["🎵 Mit Musik","Schiebe die Grooves zusammen."],
  3:["🙈 Ohne Hilfe","Höre genau und schiebe zusammen."]
};
function startBMatch(level){
  bmLevel=level;showScreen('bMatchGame');
  document.getElementById('bmTitle').textContent=bmMeta[level][0];
  document.getElementById('bmInstruction').textContent=bmMeta[level][1];
  restartBMatch();
}
function restartBMatch(){stopBMatch();bmRound=1;bmSuccess=0;newBMatchRound()}
function newBMatchRound(){
  stopBMatch();
  if(bmRound>5){
    showResultHTML(`<p class="resultStat statGood">${bmSuccess} von 5 Aufgaben geschafft.</p>`,()=>startBMatch(bmLevel),'bMatchMenu');
    return;
  }
  document.getElementById('bmProgress').textContent=`Runde ${bmRound} von 5`;
  document.getElementById('bmMeterWrap').classList.toggle('hidden',bmLevel===3);
  if(bmLevel===1){
    bmRoundMode='beat';
    bmPhase=(Math.random()<.5?-1:1)*(.12+Math.random()*.15);
  }else if(bmLevel===2){
    bmRoundMode='music';
    bmPhase=(Math.random()<.5?-1:1)*(.07+Math.random()*.10);
  }else{
    bmRoundMode=(bmRound%2===1)?'beat':'music';
    bmPhase=(Math.random()<.5?-1:1)*(bmRoundMode==='beat' ? (.11+Math.random()*.13) : (.07+Math.random()*.09));
  }
  setFeedback('bmFeedback','Drücke Start.');
  updateBMMeter();
}
function toggleBMatch(){if(bmRunning)stopBMatch();else startBMatchRun()}
function startBMatchRun(){
  ensureAudio();bmRunning=true;document.getElementById('bmStart').textContent='■ Stop';
  const base=ctx.currentTime+.18;
  bmNextA=base;bmNextB=base+bmPhase;bmCountA=0;bmCountB=0;
  bmTimer=setInterval(scheduleBMatch,20);scheduleBMatch();
}
function stopBMatch(){
  bmRunning=false;if(bmTimer)clearInterval(bmTimer);bmTimer=null;
  const b=document.getElementById('bmStart');if(b)b.textContent='▶ Start';
}
function scheduleBMatch(){
  if(!bmRunning)return;
  while(bmNextA<ctx.currentTime+.12){
    const beat=bmCountA%4;
    const useMusic=(bmLevel===2)||(bmLevel===3&&bmRoundMode==='music');
    if(useMusic)musicGrooveBeat(bmNextA,beat,false);else kick(bmNextA,.58,105);
    bmNextA+=BM_BEAT;bmCountA++;
  }
  while(bmNextB<ctx.currentTime+.12){
    const beat=bmCountB%4;
    const useMusic=(bmLevel===2)||(bmLevel===3&&bmRoundMode==='music');
    if(useMusic)musicGrooveBeat(bmNextB,beat,true);else kick(bmNextB,.40,150);
    bmNextB+=BM_BEAT;bmCountB++;
  }
}
function normPhase(sec,period){return((sec+period/2)%period+period)%period-period/2}
function bmError(){return normPhase(bmPhase,BM_BEAT)}
function nudgeMatch(amount){bmPhase-=amount;if(bmRunning)bmNextB-=amount;updateBMMeter()}
function updateBMMeter(){const e=Math.abs(bmError()),max=BM_BEAT/2;document.getElementById('bmMeter').style.width=Math.max(0,100-(e/max)*100)+'%'}
function checkMatch(){
  const e=Math.abs(bmError()),ok=e<.045;
  if(ok){bmSuccess++;setFeedback('bmFeedback','✓ Geschafft!','good');bmRound++;setTimeout(newBMatchRound,700)}
  else if(e<.10)setFeedback('bmFeedback','Fast! Noch etwas schieben.','warn');
  else setFeedback('bmFeedback','Noch auseinander.','warn');
}

const jog=document.getElementById('jog');let drag=false,lastX=0;
jog.addEventListener('pointerdown',e=>{jog.setPointerCapture(e.pointerId);drag=true;lastX=e.clientX});
jog.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX;lastX=e.clientX;const sec=Math.max(-.04,Math.min(.04,dx*.0012));bmPhase-=sec;if(bmRunning)bmNextB-=sec;updateBMMeter()});
jog.addEventListener('pointerup',()=>drag=false);
jog.addEventListener('pointercancel',()=>drag=false);

function showResultHTML(html,repeatFn,menuId){
  stopAll();
  ['home','aHub','aStartMenu','aMusicMenu','ownSongGame','bHub','bHearMenu','bMatchMenu','aGame','bHearGame','bMatchGame','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('resultText').innerHTML=html;
  document.getElementById('repeatBtn').onclick=repeatFn;
  document.getElementById('menuBtn').onclick=()=>showScreen(menuId);
}
function stopAll(){stopA();stopBMatch();stopHearSnippet()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});
</script>
